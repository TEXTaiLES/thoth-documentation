# Site information
site_name: THOTH Documentation
site_url: https://textailes.github.io/thoth-documentation/
site_author: TEXTaiLES
site_description: User, deployment, and developer documentation for the THOTH 3D viewer and annotator

# Copyright
copyright: Copyright &copy; 2026 TEXTaiLES

# Repository
repo_name: TEXTaiLES/thoth
repo_url: https://github.com/TEXTaiLES/thoth

# Config
theme:
  name: material
  palette:
    scheme: slate
    primary: white
  logo: assets/thoth-logo.png
  favicon: assets/thoth-logo.png

# Extra
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/TEXTaiLES/thoth

extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/extra.js

# Pages
nav:
  - Home: index.md

  - Getting started:
    - Open a scene: scene/open_scene.md
    - Sign in: scene/login.md
    - Collaborative scenes: scene/collab.md

  - User manual:
    - User interface: manual/ui.md
    - Tools: manual/tools.md
    - Models: manual/models.md
    - Selections: manual/selections.md
    - Annotation details: manual/annotations.md
    - Measurements: manual/measurements.md
    - Semantic annotations: manual/semantic_annotations.md
    - Metadata: manual/metadata.md
    - History: manual/history.md
    - Export and download: manual/export.md

  - Reference:
    - Keyboard shortcuts: keybinds/keybinds.md
    - Scene JSON: scene/scene_structure.md
    - Internal events and operations: api/events.md
    - HTTP API: api/rest.md

  - Deployment:
    - Native ATON: deployment/installation_basic.md
    - PM2: deployment/installation_advanced.md
    - Docker: deployment/docker.md
    - HESTIA integration: deployment/hestia.md
    - Configuration reference: deployment/configuration.md
